# Bygger förhandsvisningen och lägger ut den på GitHub Pages vid varje ändring.
name: Förhandsvisning på GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hämta bilder och typsnitt om de saknas
        run: |
          if [ ! -f statiskt/bilder/katt-hero.jpg ]; then sh hamta-bilder.sh; fi
      - name: Bygg sidan
        run: BAS="/${{ github.event.repository.name }}" python bygg.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  publicera:
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
